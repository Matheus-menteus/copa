<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domingo de Fogo — Simulador de Carreira no Ciclismo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d0d0f;
    --panel: #19191c;
    --panel-2: #212124;
    --border: #2c2c30;
    --yellow: #ffd100;
    --green: #39ff88;
    --red: #ff4757;
    --text: #f2f2f0;
    --muted: #9a9aa1;
  }
  *{ -webkit-tap-highlight-color: transparent; }
  html,body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; }
  .font-display{ font-family:'Oswald',sans-serif; letter-spacing:.02em; }
  .panel{ background:var(--panel); border:1px solid var(--border); }
  .panel-2{ background:var(--panel-2); border:1px solid var(--border); }

  .road-divider{
    height:3px;
    background-image: repeating-linear-gradient(90deg, var(--yellow) 0 18px, transparent 18px 32px);
    opacity:.9;
  }

  .bib{
    background: var(--panel-2);
    border:2px solid var(--yellow);
    color: var(--yellow);
    font-family:'Oswald',sans-serif;
    transform: rotate(-3deg);
  }

  .bar-track{ background:#0a0a0b; border:1px solid var(--border); }
  .bar-fill{ transition: width .5s ease; }

  .btn-option{
    background:var(--panel-2);
    border:1px solid var(--border);
    transition: border-color .15s ease, transform .1s ease, background .15s ease;
    text-align:left;
  }
  .btn-option:hover{ border-color:var(--yellow); background:#26262a; transform: translateX(2px); }
  .btn-option:active{ transform: scale(.99); }

  .btn-continuar{
    background:var(--yellow); color:#141414; text-align:center;
  }
  .btn-continuar:hover{ filter:brightness(1.08); transform:none; }

  .glow-yellow{ box-shadow: 0 0 0 1px rgba(255,209,0,.25); }

  .tier-vitoria{ color:var(--yellow); }
  .tier-podio{ color:#c9c9cd; }
  .tier-top10{ color:var(--green); }
  .tier-pelotao{ color:var(--muted); }
  .tier-ausente{ color:var(--muted); font-style:italic; }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }

  .fade-in{ animation: fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  @media (prefers-reduced-motion: reduce){
    .fade-in{ animation:none; }
    .bar-fill{ transition:none; }
  }
</style>
</head>
<body class="min-h-screen">

<div id="app" class="max-w-3xl mx-auto min-h-screen flex flex-col px-4 py-6 md:py-10">

  <!-- ===================== TELA DE CRIAÇÃO DE PERSONAGEM ===================== -->
  <div id="tela-criacao" class="flex-1 flex flex-col justify-center fade-in">
    <div class="text-center mb-8">
      <p class="font-display text-sm tracking-[0.35em] mb-1" style="color:var(--yellow)">PELOTÃO PROFISSIONAL</p>
      <h1 class="font-display text-4xl md:text-5xl font-bold">DOMINGO DE FOGO</h1>
      <p class="text-sm mt-2" style="color:var(--muted)">Sua carreira começa numa equipe Continental. O resto é calendário, ritmo e sorte.</p>
    </div>

    <div class="panel rounded-xl p-5 md:p-8 space-y-6">
      <div>
        <label class="block font-display text-sm mb-2 tracking-wide" style="color:var(--muted)">NOME DO CICLISTA</label>
        <input id="input-nome" type="text" maxlength="24" placeholder="Ex: Mateus Albuquerque"
          class="w-full rounded-lg px-4 py-3 bg-transparent panel-2 outline-none focus:border-yellow-400"
          style="border:1px solid var(--border); color:var(--text);">
      </div>

      <div>
        <label class="block font-display text-sm mb-3 tracking-wide" style="color:var(--muted)">ESCOLHA SUA VERTENTE</label>
        <div id="opcoes-vertente" class="grid gap-3"></div>
      </div>

      <button id="btn-iniciar" disabled
        class="w-full font-display text-lg py-3 rounded-lg font-semibold tracking-wide opacity-40 cursor-not-allowed transition"
        style="background:var(--yellow); color:#141414;">
        INICIAR CARREIRA
      </button>
    </div>
  </div>

  <!-- ===================== TELA DE JOGO ===================== -->
  <div id="tela-jogo" class="hidden flex-1 flex-col gap-4">

    <!-- PAINEL DE STATUS -->
    <div class="panel rounded-xl p-4 md:p-5 fade-in">
      <div class="flex items-start justify-between flex-wrap gap-2">
        <div>
          <h2 id="status-nome" class="font-display text-xl md:text-2xl font-bold leading-tight"></h2>
          <p class="text-xs md:text-sm" style="color:var(--muted)">
            <span id="status-equipe"></span> · <span id="status-papel"></span> · <span id="status-vertente"></span>
          </p>
        </div>
        <div class="text-right">
          <p class="font-display text-sm tracking-wide" style="color:var(--yellow)">TEMPORADA <span id="status-temporada"></span> · <span id="status-ano"></span></p>
          <p class="text-xs" style="color:var(--muted)" id="status-fase"></p>
        </div>
      </div>

      <div class="road-divider rounded-full my-4"></div>

      <div class="grid grid-cols-2 md:grid-cols-5 gap-3" id="status-atributos"></div>
    </div>

    <!-- ÁREA DE EVENTO -->
    <div id="card-evento" class="panel rounded-xl p-5 md:p-7 relative fade-in flex-1 flex flex-col">
      <div class="flex items-start justify-between gap-4 mb-3">
        <h3 id="evento-titulo" class="font-display text-2xl md:text-3xl font-bold pr-16"></h3>
        <div class="bib rounded-md px-3 py-1.5 text-xs font-bold shrink-0 select-none">
          <div class="text-[9px] leading-none opacity-70 text-center mb-0.5" id="evento-badge-topo">UCI PRO</div>
          <div class="text-center leading-none text-base" id="evento-badge-fundo"></div>
        </div>
      </div>

      <p id="evento-descricao" class="leading-relaxed mb-6" style="color:#d7d7d9"></p>

      <div id="evento-opcoes" class="grid gap-3 mt-auto"></div>
    </div>

    <!-- LOG / NOTÍCIAS -->
    <div class="panel-2 rounded-xl p-4 fade-in">
      <p class="font-display text-xs tracking-[0.25em] mb-2" style="color:var(--muted)">ÚLTIMAS NOTÍCIAS DO PELOTÃO</p>
      <div id="log-lista" class="space-y-1.5 text-sm"></div>
    </div>
  </div>

  <!-- ===================== TELA DE FIM DE CARREIRA (banimento/dispensa) ===================== -->
  <div id="tela-fim" class="hidden flex-1 flex flex-col justify-center items-center text-center fade-in gap-4">
    <p class="font-display text-sm tracking-[0.35em]" style="color:var(--red)">FIM DE CARREIRA</p>
    <h2 id="fim-titulo" class="font-display text-3xl md:text-4xl font-bold"></h2>
    <p id="fim-texto" class="max-w-md" style="color:var(--muted)"></p>
    <button id="btn-reiniciar" class="font-display mt-4 px-6 py-3 rounded-lg font-semibold tracking-wide"
      style="background:var(--yellow); color:#141414;">
      COMEÇAR NOVA CARREIRA
    </button>
  </div>

  <!-- ===================== TELA DE LEGADO (aposentadoria) ===================== -->
  <div id="tela-legado" class="hidden flex-1 flex-col gap-4 fade-in py-4">
    <div class="panel rounded-xl p-5 md:p-7 flex flex-col md:flex-row gap-5 items-start">
      <div class="shrink-0 panel-2 rounded-lg px-6 py-4 text-center" style="border:2px solid var(--yellow)">
        <p class="text-[10px] tracking-widest" style="color:var(--muted)">GERAL</p>
        <p class="font-display text-4xl font-bold" style="color:var(--yellow)" id="legado-geral"></p>
      </div>
      <div>
        <p class="text-[10px] tracking-widest mb-1" style="color:var(--muted)">FIM DE CARREIRA</p>
        <h2 class="font-display text-2xl md:text-3xl font-bold" id="legado-nome"></h2>
        <p class="font-display text-lg md:text-xl" style="color:var(--yellow)" id="legado-tagline"></p>
        <p class="text-xs mt-1" style="color:var(--muted)" id="legado-subtitulo"></p>
        <p class="text-sm italic mt-3 border-l-2 pl-3" style="border-color:var(--yellow); color:#d7d7d9" id="legado-frase"></p>
      </div>
    </div>

    <div class="panel rounded-xl p-5">
      <p class="font-display text-xs tracking-[0.25em] mb-3" style="color:var(--muted)">NÚMEROS DA CARREIRA</p>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="legado-numeros"></div>
    </div>

    <div class="panel rounded-xl p-5">
      <p class="font-display text-xs tracking-[0.25em] mb-3" style="color:var(--muted)">TÍTULOS POR PROVA</p>
      <div class="grid grid-cols-2 md:grid-cols-3 gap-3" id="legado-titulos"></div>
    </div>

    <div class="panel rounded-xl p-5">
      <p class="font-display text-xs tracking-[0.25em] mb-3" style="color:var(--muted)">TEMPORADA A TEMPORADA</p>
      <div class="overflow-y-auto" id="legado-temporadas" style="max-height:320px"></div>
    </div>

    <button id="btn-nova-carreira-legado" class="font-display px-6 py-3 rounded-lg font-semibold tracking-wide self-start"
      style="background:var(--yellow); color:#141414;">
      COMEÇAR NOVA CARREIRA
    </button>
  </div>

</div>

  explosao: "Explosão",
  resistencia: "Resistência",
  reputacao: "Reputação",
  suspeitaDoping: "Susp. Doping"
};

/* Limiares de pontuação para cada tipo de prova */
const LIMIARES = {
  menor:     { vitoria: 88, podio: 75, top10: 58 },
  especial:  { vitoria: 95, podio: 82, top10: 63 },
  monumento: { vitoria: 100, podio: 85, top10: 65 },
  grandvolta:{ vitoria: 92, podio: 78, top10: 60 }
};

/* O pelotão também evolui: a cada temporada os limiares sobem um pouco,
   então manter o nível de vitórias exige continuar evoluindo o ciclista. */
const INCREMENTO_POR_TEMPORADA = 2.2;
const INCREMENTO_MAXIMO = 30;

function limiarAjustado(tipo){
  const base = LIMIARES[tipo];
  const inc = Math.min(INCREMENTO_MAXIMO, (gameState.temporada - 1) * INCREMENTO_POR_TEMPORADA);
  return {
    vitoria: base.vitoria + inc,
    podio: base.podio + inc * 0.85,
    top10: base.top10 + inc * 0.7
  };
}

/* Retornos decrescentes: passar de 80 num atributo ainda ajuda, mas cada vez menos —
   evita que o ciclista vire "imbatível" só empilhando atributo. */
function statEfetivo(valor){
  return valor <= 80 ? valor : 80 + (valor - 80) * 0.35;
}

const MAX_TEMPORADAS = 14;

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
function clamp(v){ return Math.max(0, Math.min(100, v)); }

function aplicarEfeitos(efeitos){
  for (const chave in efeitos){
    if (chave in gameState.atributos){
      gameState.atributos[chave] = clamp(gameState.atributos[chave] + efeitos[chave]);
    }
  }
}

function adicionarLog(texto){
  gameState.log.unshift(texto);
  gameState.log = gameState.log.slice(0, 3);
}

function shuffle(array){
  const a = [...array];
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function proximaDecisaoAleatoria(){
  if (gameState.filaDecisoes.length === 0){
    gameState.filaDecisoes = shuffle(POOL_DECISOES_ALEATORIAS);
  }
  return gameState.filaDecisoes.pop();
}
/* ============================================================
   INTEGRAÇÃO COM A IA (GEMINI)
   ============================================================ */
async function dispararEventoIA() {
  // 1. Coloca uma "Tela de Carregamento" charmosa na tela do jogo
  document.getElementById("evento-titulo").textContent = "Bastidores do Pelotão...";
  document.getElementById("evento-descricao").innerHTML = `<span style="color:var(--yellow)">A comissão técnica está tomando uma decisão... (Gerando evento inédito com IA 🧠)</span>`;
  document.getElementById("evento-opcoes").innerHTML = "";
  setBadge("IA", "GERANDO");

  // 2. Empacota os dados do seu ciclista
  const dadosParaIA = {
    temporada: gameState.temporada,
    equipe: gameState.equipe,
    vertente: gameState.vertente,
    potencia: gameState.atributos.potencia,
    explosao: gameState.atributos.explosao,
    resistencia: gameState.atributos.resistencia,
    reputacao: gameState.atributos.reputacao
  };

  try {
    // 3. Manda para o nosso "guarda-costas" na Vercel
    const resposta = await fetch('/api/evento', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dadosParaIA)
    });

    if (!resposta.ok) throw new Error("Erro de comunicação com a API.");

    // 4. Recebe o evento em JSON e joga na tela!
    const eventoIA = await resposta.json();
    renderDecisao(eventoIA);

  } catch (erro) {
    console.error("A IA falhou ou demorou demais:", erro);
    // Se a API der qualquer erro, o jogo não quebra. Ele puxa um evento normal do banco fixo.
    const idBackup = proximaDecisaoAleatoria();
    renderDecisao(EVENTOS_DECISAO[idBackup]);
  }
}

function aplicarRecuperacaoPassiva(){
  const atr = gameState.atributos;
  atr.resistencia = clamp(atr.resistencia + 2);

}

function avancarCalendario(){
  aplicarRecuperacaoPassiva();

  if (gameState.eventoForcado){
    const id = gameState.eventoForcado;
    gameState.eventoForcado = null;
    renderDecisao(EVENTOS_DECISAO[id]);
    return;
  }

  let blocoAtual = gameState.calendario[gameState.blocoIndex];

  if (gameState.itemIndex >= blocoAtual.itens.length){
    gameState.blocoIndex += 1;
    gameState.itemIndex = 0;
    if (gameState.blocoIndex >= gameState.calendario.length){
      finalizarTemporada();
      return;
    }
    blocoAtual = gameState.calendario[gameState.blocoIndex];
    gameState.faseAtual = blocoAtual.fase;
    adicionarLog(`Início da fase: ${blocoAtual.fase}.`);
  }

  if (!gameState.faseAtual){
    gameState.faseAtual = blocoAtual.fase;
  }

  const item = blocoAtual.itens[gameState.itemIndex];
  gameState.itemIndex += 1;

  renderStatus();
  renderLog();

  if (item.tipo === "decisao"){
    const id = item.id === "__random__" ? proximaDecisaoAleatoria() : item.id;
    renderDecisao(EVENTOS_DECISAO[id]);
  } else {
    const corrida = CORRIDAS[item.id];
    if (corrida.tipo === "grandvolta"){
      gameState.grandVoltaTemp = { tacticSum: 0, count: 0 };
      renderCorridaGrandVolta(corrida, 0);
    } else {

}

/* ============================================================
   PONTUAÇÃO E RESULTADOS DE CORRIDA
   ============================================================ */
function papelModificador(){
  if (gameState.papel === "Gregário"){
    return gameState.vertente === "Gregário de Luxo" ? -3 : -9;
  }
  if (gameState.papel === "Co-líder") return -3;
  return 0;
}

function bonusVertente(tipo){
  if (gameState.vertente === "Grandes Voltas" && tipo === "grandvolta") return 6;
  if (gameState.vertente === "Clássicas de Um Dia" && (tipo === "monumento" || tipo === "especial")) return 6;
  return 0;
}

function calcularScore(pesos, tipo, tacticMod){
  const atr = gameState.atributos;
  const base = statEfetivo(atr.potencia) * (pesos.potencia || 0) + statEfetivo(atr.explosao) * (pesos.explosao || 0) + statEfetivo(atr.resistencia) * (pesos.resistencia || 0);
  const teamBonus = (gameState.equipeRating - 50) / 6;
  const papelMod = papelModificador();
  const vertBonus = bonusVertente(tipo);
  const rand = Math.floor(Math.random() * 25) - 12;
  return base + teamBonus + papelMod + vertBonus + tacticMod + rand;
}

function determinarTier(tipo, score){
  const t = limiarAjustado(tipo);
  if (score >= t.vitoria) return "vitoria";
  if (score >= t.podio) return "podio";
  if (score >= t.top10) return "top10";
  return "pelotao";
}

function atualizarRatingEquipe(tipo, tier){
  if (gameState.papel !== "Líder") return;
  if (tipo !== "monumento" && tipo !== "grandvolta" && tipo !== "especial") return;
  const ganho = tipo === "grandvolta" ? 3 : 2;
  if (tier === "vitoria"){
    gameState.equipeRating = clamp(gameState.equipeRating + ganho);
  } else if (tier === "pelotao"){
    gameState.equipeRating = clamp(gameState.equipeRating - 1);
  }
}

function principalAtributo(pesos){
  return Object.keys(pesos).reduce((a, b) => (pesos[a] || 0) >= (pesos[b] || 0) ? a : b);
}

function resolverResultado(nomeExibicao, tipo, pesos, tacticMod){
  const score = calcularScore(pesos, tipo, tacticMod);
  const tier = determinarTier(tipo, score);
  let recompensa = RECOMPENSAS[tipo][tier];
  if (gameState.papel === "Gregário" && gameState.vertente === "Gregário de Luxo"){
    recompensa += 2;
  }
  gameState.atributos.reputacao = clamp(gameState.atributos.reputacao + recompensa);
  if (gameState.atributos.suspeitaDoping > 0){
    gameState.atributos.suspeitaDoping = clamp(gameState.atributos.suspeitaDoping - 1);
  }

  let atributoGanho = null;
  let ganho = 0;
  if (tier === "vitoria" || tier === "podio"){
    atributoGanho = principalAtributo(pesos);
    ganho = tier === "vitoria" ? 4 : 2;
    gameState.atributos[atributoGanho] = clamp(gameState.atributos[atributoGanho] + ganho);
  }

  atualizarRatingEquipe(tipo, tier);
  gameState.resultadosTemporada.push({ nome: nomeExibicao, tipo, tier });

  gameState.estatisticasCarreira.corridas += 1;
  gameState.estatisticasCarreira[tier] += 1;
  if (tier === "vitoria"){
    gameState.titulosPorProva[nomeExibicao] = (gameState.titulosPorProva[nomeExibicao] || 0) + 1;
  }

  if (gameState.atributos.suspeitaDoping >= 55 && Math.random() < 0.3){
    gameState.eventoForcado = "controle_antidoping";
  }

  return { score, tier, recompensa, atributoGanho, ganho };
}

const FRASES_REPETICAO = [

function fraseRepeticao(nomeCorrida){
  if (!gameState.corridasVisitadas) gameState.corridasVisitadas = {};
  const vezes = gameState.corridasVisitadas[nomeCorrida] || 0;
  gameState.corridasVisitadas[nomeCorrida] = vezes + 1;
  if (vezes === 0) return "";
  const frase = FRASES_REPETICAO[Math.floor(Math.random() * FRASES_REPETICAO.length)];
  return frase.replace("{nome}", gameState.nome).replace("{corrida}", nomeCorrida);
}

function dispensarCorrida(nomeExibicao, tipo){

  gameState.atributos.resistencia = clamp(gameState.atributos.resistencia + 10);
  gameState.atributos.explosao = clamp(gameState.atributos.explosao + 3);
  gameState.atributos.potencia = clamp(gameState.atributos.potencia + 3);
  adicionarLog(`Você pediu dispensa de ${nomeExibicao} para focar na recuperação e no restante da temporada. (${penalidade} Reputação, corpo mais fresco)`);

  renderResultado(corrida.nome, resultado);

function renderCorridaGrandVolta(corrida, subIndex){
  const sub = corrida.subEtapas[subIndex];
  document.getElementById("evento-titulo").textContent = sub.titulo;
  const prefixo = subIndex === 0 ? fraseRepeticao(corrida.nome) : "";
  document.getElementById("evento-descricao").textContent = prefixo + sub.descricao;
  setBadge(TIPO_LABEL_CURTO[corrida.tipo], gameState.ano);
  const opcoes = subIndex === 0 ? sub.opcoes.concat([opcaoDispensa()]) : sub.opcoes;
  montarBotoesOpcoes(opcoes, opcao => escolherOpcaoGrandVolta(corrida, opcao, subIndex));
  reanimarCard();

function escolherOpcaoGrandVolta(corrida, opcao, subIndex){
  if (opcao.dispensa){
    gameState.grandVoltaTemp = null;
    dispensarCorrida(corrida.nome, corrida.tipo);
    renderStatus();
    renderLog();
    if (verificarFimDeCarreira()) return;
    avancarCalendario();
    return;
  }

  aplicarEfeitos(opcao.efeitos || {});
  adicionarLog(opcao.feedback);
  gameState.grandVoltaTemp.tacticSum += (opcao.tacticMod || 0);
  gameState.grandVoltaTemp.count += 1;
  renderStatus();
  renderLog();

  if (verificarFimDeCarreira()) return;

  if (subIndex === 0){
    renderCorridaGrandVolta(corrida, 1);
  } else {
    const tacticMedio = gameState.grandVoltaTemp.tacticSum / gameState.grandVoltaTemp.count;
    gameState.grandVoltaTemp = null;
    const resultado = resolverResultado(corrida.nome, corrida.tipo, corrida.pesos, tacticMedio);
    renderResultado(corrida.nome + " — Classificação Geral", resultado);
  }
}

    }).join("");
    desc.innerHTML = `<div class="text-sm">${linhas}</div>`;
  }

  const container = document.getElementById("evento-opcoes");
  container.innerHTML = "";
  const btn = document.createElement("button");
  btn.className = "btn-option btn-continuar rounded-lg px-4 py-3 w-full font-display font-semibold tracking-wide";
  btn.textContent = aposentando ? "Encerrar carreira e ver o legado" : "Ver mercado de transferências";
  btn.addEventListener("click", () => {
    gameState.resultadosTemporada = [];
    if (aposentando){
      renderResumoCarreira();
    } else {
      renderEventoContrato();
    }
  });
  container.appendChild(btn);

  reanimarCard();
}

function sortearEquipeDiferente(pool){
  const opcoes = pool.filter(t => t.nome !== gameState.equipe);
  return opcoes[Math.floor(Math.random() * opcoes.length)];
}

function gerarOfertaContrato(){
  const atr = gameState.atributos;
  const statMedio = (atr.potencia + atr.explosao + atr.resistencia) / 3;
  const nivelJogador = atr.reputacao * 0.5 + statMedio * 0.5;

  let poolForte;
  if (nivelJogador >= 75) poolForte = EQUIPES_ELITE;
  else if (nivelJogador >= 55) poolForte = EQUIPES_FORTES;
  else poolForte = EQUIPES_MEDIAS;

  const timeA = sortearEquipeDiferente(poolForte);
  let timeB = sortearEquipeDiferente(EQUIPES_MEDIAS.concat(EQUIPES_FRACAS));
  if (timeB.nome === timeA.nome){
    timeB = sortearEquipeDiferente(EQUIPES_FRACAS);
  }
  return { timeA, timeB };
}

function renderEventoContrato(){
  const oferta = gerarOfertaContrato();
  document.getElementById("evento-titulo").textContent = "Mercado de Transferências";
  setBadge("CONTRATO", gameState.ano);
  document.getElementById("evento-descricao").textContent =
    `Fim de temporada. Seu empresário chega com duas propostas concretas na mesa, além da possibilidade de renovar com a ${gameState.equipe}.`;

  const opcoes = [
    {
      texto: `Ir para a ${oferta.timeA.nome} como gregário`,
      onSelecionar: () => {
        adicionarLog(`${gameState.nome} assina com a ${oferta.timeA.nome} como gregário, trocando protagonismo por estrutura.`);
        gameState.equipe = oferta.timeA.nome;
        gameState.equipeRating = oferta.timeA.rating;
        gameState.papel = "Gregário";
      }
    },
    {
      texto: `Assumir a ${oferta.timeB.nome} como líder máximo`,
      onSelecionar: () => {
        adicionarLog(`${gameState.nome} assina com a ${oferta.timeB.nome} como líder absoluto do projeto esportivo.`);
        gameState.equipe = oferta.timeB.nome;
        gameState.equipeRating = oferta.timeB.rating;
        gameState.papel = "Líder";
      }
    },
    {
      texto: `Permanecer na ${gameState.equipe} (renovar contrato)`,
      onSelecionar: () => {
        adicionarLog(`${gameState.nome} renova contrato com a ${gameState.equipe}.`);
        if (gameState.papel === "Gregário" && gameState.atributos.reputacao >= 80){
          gameState.papel = "Co-líder";
          adicionarLog(`Depois de tanta entrega, a equipe promete mais liberdade: ${gameState.nome} agora corre como co-líder.`);
        }
        gameState.equipeRating = clamp(gameState.equipeRating + 1);
      }
    }
  ];

  montarBotoesOpcoes(opcoes, opcao => {
    opcao.onSelecionar();
    renderStatus();
    renderLog();
    avancarParaProximaTemporada();
  });

  reanimarCard();
}

function avancarParaProximaTemporada(){
  gameState.temporada += 1;
  gameState.ano += 1;
  gameState.blocoIndex = 0;
  gameState.itemIndex = 0;
  gameState.faseAtual = null;
  gameState.calendario = construirCalendarioTemporada(gameState.ano);
  renderStatus();
  avancarCalendario();
}

/* ============================================================
   FIM DE CARREIRA
   ============================================================ */
function verificarFimDeCarreira(){
  if (gameState.atributos.suspeitaDoping >= 100){
    mostrarFim(
      "Flagrado no Controle Antidopagem",
      `${gameState.nome} foi pego em um exame da agência antidopagem. A ${gameState.equipe} rescinde o contrato no mesmo dia. O nome sai do pelotão e não volta mais.`
    );
    return true;
  }
  if (gameState.atributos.reputacao <= 0){
    mostrarFim(
      "Dispensado pela Equipe",
      `Depois de acumular decisões impopulares e atritos com companheiros e diretoria, a ${gameState.equipe} decide não renovar o contrato de ${gameState.nome}. Nenhuma outra equipe faz proposta.`
    );
    return true;
  }
  return false;
}

function mostrarFim(titulo, texto){
  gameState.gameOver = true;
  document.getElementById("tela-jogo").classList.add("hidden");
  document.getElementById("tela-jogo").classList.remove("flex");
  document.getElementById("fim-titulo").textContent = titulo;
  document.getElementById("fim-texto").textContent = texto;
  document.getElementById("tela-fim").classList.remove("hidden");
  document.getElementById("tela-fim").classList.add("flex");
}

document.getElementById("btn-reiniciar").addEventListener("click", () => {
  document.getElementById("tela-fim").classList.add("hidden");
  document.getElementById("tela-fim").classList.remove("flex");
  document.getElementById("tela-criacao").classList.remove("hidden");
  document.getElementById("input-nome").value = "";
  vertenteEscolhida = null;
  montarOpcoesVertente();
  atualizarBotaoIniciar();
});

/* ============================================================
   TELA DE LEGADO — RESUMO FINAL DE CARREIRA (APOSENTADORIA)
   ============================================================ */
const GRUPOS_TITULOS = [
  { label: "Grandes Voltas", nomes: ["Giro d'Italia", "Tour de France", "Vuelta a España"] },
  { label: "Monumentos", nomes: ["Milão–Sanremo", "Ronde van Vlaanderen", "Paris–Roubaix", "Liège–Bastogne–Liège", "Il Lombardia"] },
  { label: "Mundiais", nomes: ["Campeonato Mundial de Estrada"] },
  { label: "Olimpíadas", nomes: ["Jogos Olímpicos — Ciclismo de Estrada"] },
  { label: "Strade Bianche", nomes: ["Strade Bianche"] },
  { label: "Provas Menores", nomes: ["Volta à Catalunha", "Critérium du Dauphiné"] }
];

const FRASES_LEGADO = {
  lenda: ["Um dos maiores nomes que o ciclismo já viu.", "Geração inteira vai lembrar dessas pernas."],
  grande: ["Um nome que o pelotão respeitava de verdade.", "Não venceu tudo, mas ninguém subestimava."],
  solida: ["Uma carreira honesta, construída prova a prova.", "Sem grandes títulos, mas com respeito de sobra."],
  discreta: ["Uma carreira discreta, longe dos holofotes.", "Rodou bastante estrada sem nunca virar manchete."],
  dificil: ["Uma carreira marcada por dificuldades.", "O pelotão profissional nem sempre é gentil."]
};

function calcularGeralCarreira(){
  const atr = gameState.atributos;
  const media = (atr.potencia + atr.explosao + atr.resistencia) / 3;
  let titulosGrandes = 0;
  GRUPOS_TITULOS.forEach(g => {
    if (g.label === "Provas Menores") return;
    g.nomes.forEach(n => { titulosGrandes += (gameState.titulosPorProva[n] || 0); });
  });
  const bonusTitulos = Math.min(30, titulosGrandes * 2.2);
  let geral = Math.round(media * 0.45 + atr.reputacao * 0.25 + bonusTitulos);
  return Math.max(40, Math.min(99, geral));
}

function faixaLegado(geral){
  if (geral >= 90) return "lenda";
  if (geral >= 78) return "grande";
  if (geral >= 63) return "solida";
  if (geral >= 48) return "discreta";
  return "dificil";
}

const TAGLINE_LEGADO = {
  lenda: "Uma lenda do ciclismo mundial",
  grande: "Um dos grandes nomes da sua geração",
  solida: "Uma carreira sólida e respeitada no pelotão",
  discreta: "Uma carreira discreta, mas honesta",
  dificil: "Uma carreira de muitas dificuldades"
};

function renderResumoCarreira(){
  document.getElementById("tela-jogo").classList.add("hidden");
  document.getElementById("tela-jogo").classList.remove("flex");

  const geral = calcularGeralCarreira();
  const faixa = faixaLegado(geral);
  const frases = FRASES_LEGADO[faixa];

  document.getElementById("legado-geral").textContent = geral;
  document.getElementById("legado-nome").textContent = gameState.nome;
  document.getElementById("legado-tagline").textContent = TAGLINE_LEGADO[faixa].toUpperCase();

  const equipesDefendidas = new Set(gameState.historicoTemporadas.map(t => t.equipe)).size;
  document.getElementById("legado-subtitulo").textContent =
    `${gameState.vertente} · ${equipesDefendidas} equipe(s) · ${gameState.historicoTemporadas.length} temporadas`;
  document.getElementById("legado-frase").textContent = frases[Math.floor(Math.random() * frases.length)];

  const est = gameState.estatisticasCarreira;
  const numeros = [
    { label: "Temporadas", valor: gameState.historicoTemporadas.length },
    { label: "Provas Disputadas", valor: est.corridas },
    { label: "Vitórias", valor: est.vitorias },
    { label: "Pódios", valor: est.podios },
    { label: "Top 10", valor: est.top10 },
    { label: "Fora do Destaque", valor: est.pelotao },
    { label: "Dispensas Pedidas", valor: est.ausencias },
    { label: "Reputação Final", valor: gameState.atributos.reputacao }
  ];
  const numerosContainer = document.getElementById("legado-numeros");
  numerosContainer.innerHTML = numeros.map(n => `
    <div class="panel-2 rounded-lg px-3 py-3 text-center">
      <div class="font-display text-2xl font-bold" style="color:var(--yellow)">${n.valor}</div>
      <div class="text-[11px] mt-1" style="color:var(--muted)">${n.label}</div>
    </div>
  `).join("");

  const titulosContainer = document.getElementById("legado-titulos");
  titulosContainer.innerHTML = GRUPOS_TITULOS.map(g => {
    const total = g.nomes.reduce((soma, n) => soma + (gameState.titulosPorProva[n] || 0), 0);
    return `
      <div class="panel-2 rounded-lg px-3 py-3 text-center">
        <div class="font-display text-xl font-bold" style="color:${total > 0 ? 'var(--green)' : 'var(--muted)'}">${total}</div>
        <div class="text-[11px] mt-1" style="color:var(--muted)">${g.label}</div>
      </div>
    `;
  }).join("");

  const temporadasContainer = document.getElementById("legado-temporadas");
  temporadasContainer.innerHTML = gameState.historicoTemporadas.map(t => {
    const melhor = t.resultados
      .filter(r => r.tier === "vitoria" || r.tier === "podio")
      .sort((a, b) => (a.tier === "vitoria" ? -1 : 1))[0];
    const destaque = melhor ? `${melhor.nome} — ${TIER_LABEL[melhor.tier]}` : "Sem destaque na temporada";
    return `
      <div class="flex items-center justify-between py-2 border-b text-sm" style="border-color:var(--border)">
        <span style="color:var(--muted)" class="w-20 shrink-0">${t.ano}</span>
        <span class="flex-1">${t.equipe}</span>
        <span class="w-16 text-center" style="color:var(--yellow)">🏆${t.vitorias}</span>
        <span class="w-32 text-right text-xs" style="color:var(--muted)">${destaque}</span>
      </div>
    `;
  }).join("");

  document.getElementById("tela-legado").classList.remove("hidden");
  document.getElementById("tela-legado").classList.add("flex");
}

document.getElementById("btn-nova-carreira-legado").addEventListener("click", () => {
  document.getElementById("tela-legado").classList.add("hidden");
  document.getElementById("tela-legado").classList.remove("flex");
  document.getElementById("tela-criacao").classList.remove("hidden");
  document.getElementById("input-nome").value = "";
  vertenteEscolhida = null;
  montarOpcoesVertente();
  atualizarBotaoIniciar();
});

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
montarOpcoesVertente();
atualizarBotaoIniciar();
</script>
